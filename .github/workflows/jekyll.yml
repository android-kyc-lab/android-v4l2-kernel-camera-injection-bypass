name: 💣 Build & Deploy via Official Actions

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🔥 Check out repo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Ruby 3.3 with Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 🧨 Build Jekyll Site
        run: bundle exec jekyll build --source docs --destination _site

      - name: 📤 Upload Pages Artifact (no deprecation)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🟩 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4