name: 🚀 Deploy Static Site (No Jekyll)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🔥 Check out repo
        uses: actions/checkout@v4

      - name: 📁 Prepare _site by copying docs
        run: |
          mkdir -p _site
          cp -r docs/* _site/

      - name: 📤 Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: 🟩 Deploy to Pages
        uses: actions/deploy-pages@v4