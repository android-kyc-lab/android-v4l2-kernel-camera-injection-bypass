# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [$default-branch]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5        # ✅ UPGRADED from v4 to v5

      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # ========== NEW FEATURE 1: Validate the build ==========
      - name: ✅ Validate built site
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "❌ ERROR: _site/index.html not found – build failed!"
            exit 1
          fi
          echo "✅ Site built successfully: $(find _site -type f | wc -l) files"

      # ========== NEW FEATURE 2: Check for broken links (optional) ==========
      # - name: 🔗 Check for broken links
      #   run: |
      #     gem install html-proofer
      #     htmlproofer ./_site --disable-external --assume-extension --allow-hash-href
      #   continue-on-error: true   # Won't fail the workflow, but logs warnings

      # ========== NEW FEATURE 3: Generate .nojekyll to bypass GitHub Pages Jekyll processing ==========
      - name: 📄 Create .nojekyll (bypass GitHub Pages Jekyll)
        run: touch _site/.nojekyll

      # ========== NEW FEATURE 4: Ping Google (only) ==========
      - name: 📣 Ping Google (sitemap)
        run: |
          SITE_URL="https://${{ steps.pages.outputs.hostname }}${{ steps.pages.outputs.base_path }}"
          curl -s "https://www.google.com/ping?sitemap=${SITE_URL}/sitemap.xml" || echo "Google ping skipped"
        continue-on-error: true   # Won't fail the deployment if search engines are unreachable

      # ========== NEW FEATURE 5: Compress static assets (gzip) ==========
      - name: 🗜️ Gzip compress static assets
        run: |
          find _site -type f -name "*.html" -exec gzip -k -9 {} \;
          find _site -type f -name "*.css" -exec gzip -k -9 {} \;
          find _site -type f -name "*.js" -exec gzip -k -9 {} \;
          find _site -type f -name "*.xml" -exec gzip -k -9 {} \;
          echo "✅ Gzip compression completed"

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5