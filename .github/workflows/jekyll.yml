name: 💣 Direct Page Deploy (Jekyll + Bundler)

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🔥 Check out repo
        uses: actions/checkout@v5

      - name: 🛠️ Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 📦 Install dependencies
        run: bundle install

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: 🧨 Build Jekyll Site
        run: bundle exec jekyll build --source docs --destination _site

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3    # ✅ NOT deprecated
        with:
          path: ./_site

  deploy:
    needs: build-and-upload
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🟩 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4