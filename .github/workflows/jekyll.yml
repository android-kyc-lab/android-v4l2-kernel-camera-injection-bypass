name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: 🚪 Check out repo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Ruby with Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 🧨 Build Jekyll site
        run: bundle exec jekyll build --source docs --destination _site

      - name: 📤 Upload Pages artifact (NOT deprecated)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🟩 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4