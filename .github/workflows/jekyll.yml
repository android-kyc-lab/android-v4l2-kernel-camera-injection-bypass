name: 💣 Direct Page Deploy (Jekyll + Bundler)

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🔥 Check out repo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 📦 Install dependencies (explicit)
        run: bundle install

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: 🧨 Build Jekyll Site
        run: bundle exec jekyll build --source docs --destination _site

      - name: 📤 Upload via GitHub Pages API
        run: |
          ZIP_FILE="artifacts.zip"
          zip -r $ZIP_FILE _site/
          UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds \
            -d '{}' | jq -r '.upload_url')
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @"$ZIP_FILE" \
            "$UPLOAD_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}