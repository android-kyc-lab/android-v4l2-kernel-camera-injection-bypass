name: 💣 Direct Page Deploy (Static Copy – No Jekyll)

on:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🔥 Check out repo
        uses: actions/checkout@v4

      - name: 📁 Prepare _site by copying docs folder
        run: |
          mkdir -p _site
          cp -r docs/* _site/

      - name: 📤 Upload via GitHub Pages API (NO Jekyll, NO artifacts)
        run: |
          ZIP_FILE="artifacts.zip"
          zip -r $ZIP_FILE _site/

          # Get upload URL
          UPLOAD_URL=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds \
            -d '{}' | jq -r '.upload_url')

          # Upload the ZIP
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @"$ZIP_FILE" \
            "$UPLOAD_URL"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}